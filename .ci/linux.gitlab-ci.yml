.golang-inputs: &golang_inputs
  runOnMR: true
  runOnBranches: "^master$"
  outputDir: artifacts
  runner: linux-x86-8cpu-16gb
  stage: build
  golangVersion: "1.27"
  imageVersion: "3734-d33fce68ee03@sha256:c42e28de523766b042588659b22f5539fecd8d3a0207cdb64acac8522613d465"
  # The race detector used by `make test` requires cgo. Build jobs below
  # explicitly disable it.
  CGO_ENABLED: 1

.default-packaging-job: &packaging-job-defaults
  stage: package
  needs:
    - ci-image-get-image-ref
  rules:
    - !reference [.default-rules, run-on-master]
  image: $BUILD_IMAGE
  cache:
    key:
      prefix: "$CI_COMMIT_REF_PROTECTED-$GO_VERSION-$CI_RUNNER_EXECUTABLE_ARCH"
      files:
        - go.sum
    paths:
      - .cache/go/
  artifacts:
    paths:
      - artifacts/*

include:
  ###########################
  #### Linux AMD64 Build ####
  ###########################
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      jobPrefix: linux-build
      GOLANG_MAKE_TARGET: ci-build
      CGO_ENABLED: 0

  ###########################
  #### Linux ARM64 Build ####
  ###########################
  # Builds the arm64 binary natively on an arm64 runner on MRs so that arm64
  # build breakages are caught before merge. Only the binary is built; no
  # packages are produced.
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      runner: linux-arm64-8cpu-16gb
      jobPrefix: linux-build-arm64
      GOLANG_MAKE_TARGET: ci-build-arm64
      CGO_ENABLED: 0

  ########################
  ### Linux FIPS Build ###
  ########################
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      jobPrefix: linux-fips-build
      GOLANG_MAKE_TARGET: ci-fips-build
      CGO_ENABLED: 0

  #################
  ### Unit Tests ##
  #################
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      stage: test
      jobPrefix: test
      GOLANG_MAKE_TARGET: ci-test

  ###########################
  ### Unit Tests (ARM64) ###
  ###########################
  # Runs the unit tests natively on an arm64 runner. Lint and format checks
  # are architecture independent and already run in the amd64 job above.
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      runner: linux-arm64-8cpu-16gb
      stage: test
      jobPrefix: test-arm64
      GOLANG_MAKE_TARGET: ci-test-arm64

  ######################
  ### Unit Tests FIPS ##
  ######################
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      stage: test
      jobPrefix: test-fips
      GOLANG_MAKE_TARGET: ci-fips-test

  #################
  ### Vuln Check ##
  #################
  - component: $CI_SERVER_FQDN/cloudflare/ci/golang/make@~latest
    inputs:
      <<: *golang_inputs
      runOnBranches: "^$"
      stage: validate
      jobPrefix: vulncheck
      GOLANG_MAKE_TARGET: vulncheck

#################################
### Run Linux Component Tests ###
#################################
linux-component-tests: &linux-component-tests
  stage: test
  extends: .component-tests
  needs:
    - ci-image-get-image-ref
    - linux-build-make
  script:
    - ./.ci/scripts/component-tests.sh
  variables: &component-tests-variables
    CI: 1
    COMPONENT_TESTS_CONFIG_CONTENT: Y2xvdWRmbGFyZWRfYmluYXJ5OiAuL2Nsb3VkZmxhcmVkCmNyZWRlbnRpYWxzX2ZpbGU6IGNyZWQuanNvbgpvcmlnaW5jZXJ0OiBjZXJ0LnBlbQp6b25lX2RvbWFpbjogYXJnb3R1bm5lbHRlc3QuY29tCnpvbmVfdGFnOiA0ODc5NmYxZTcwYmI3NjY5YzI5YmI1MWJhMjgyYmY2NQ==
  tags:
    - linux-x86-8cpu-16gb
  artifacts:
    reports:
      junit: report.xml

######################################
### Run Linux FIPS Component Tests ###
######################################
linux-component-tests-fips:
  <<: *linux-component-tests
  needs:
    - ci-image-get-image-ref
    - linux-fips-build-make
  variables:
    <<: *component-tests-variables
    COMPONENT_TESTS_FIPS: 1

################################
####### Linux Packaging ########
################################
linux-packaging:
  <<: *packaging-job-defaults
  parallel:
    matrix:
      - ARCH: ["386", "amd64", "arm", "armhf", "arm64"]
  script:
    - ./.ci/scripts/linux/build-packages.sh ${ARCH}

################################
##### Linux FIPS Packaging #####
################################
linux-packaging-fips:
  <<: *packaging-job-defaults
  script:
    - ./.ci/scripts/linux/build-packages-fips.sh
